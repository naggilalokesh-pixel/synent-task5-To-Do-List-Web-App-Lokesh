<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="todo-app">

        <!-- Header -->
        <header class="app-header">
            <h1>TaskFlow</h1>
            <p>Stay organized. Get things done.</p>
        </header>

        <!-- Task Input -->
        <section class="task-input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >

            <button id="addTaskBtn">
                + Add Task
            </button>
        </section>

        <!-- Task Information -->
        <section class="task-info">
            <h2>My Tasks</h2>
            <span id="taskCount">0 tasks</span>
        </section>

        <div class="task-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
</div>
        <!-- Task List -->
        <ul id="taskList" class="task-list">
            <!-- Tasks will be created by JavaScript -->
        </ul>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <h3>No tasks yet</h3>
            <p>Add your first task to get started.</p>
        </div>

        <!-- Footer Stats -->
        <footer class="task-footer">
    <div class="task-stats">
        <span id="remainingCount">0 remaining</span>
        <span id="completedCount">0 completed</span>
    </div>

    <button id="clearCompletedBtn">Clear Completed</button>
</footer>

    </main>
<footer class="developer-footer">
    <p>
        Designed & Developed by <strong>N. Lokesh</strong>
        <span>•</span>
        Web Development Intern
        <span>•</span>
        Synent Technologies
        <span>•</span>
        2026
    </p>
</footer>

    <script src="script.js"></script>
</body>
</html>
